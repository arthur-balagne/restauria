
services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: restauria-php
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:rw
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-}
      DATABASE_URL: "mysql://${MARIADB_USER:-app}:${MARIADB_PASSWORD:-!ChangeMe!}@restauria-database:3306/${MARIADB_DATABASE:-restauria}?serverVersion=mariadb-11.4.0&charset=utf8mb4"
      MESSENGER_TRANSPORT_DSN: "redis://restauria-redis:6379/messages"
      MAILER_DSN: "smtp://restauria-mailpit:1025"
      REDIS_URL: "redis://restauria-redis:6379"
    depends_on:
      - database
      - redis
      - mailpit

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: restauria-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./:/var/www/html:ro
    depends_on:
      - php

  database:
    image: mariadb:latest
    container_name: restauria-database
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-restauria}
      MARIADB_USER: ${MARIADB_USER:-app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-!ChangeMe!}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-!RootChangeMe!}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - database_data:/var/lib/mysql:rw

  redis:
    image: redis:alpine
    container_name: restauria-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data:rw

  mailpit:
    image: axllent/mailpit:latest
    container_name: restauria-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  database_data:
  redis_data:
